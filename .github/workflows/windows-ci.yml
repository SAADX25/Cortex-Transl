name: Windows build and reliability tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CortexTransl.sln
      - name: Build
        run: dotnet build CortexTransl.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CortexTransl.sln --configuration Release --no-build --logger "trx;LogFileName=reliability.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-results
          path: TestResults
